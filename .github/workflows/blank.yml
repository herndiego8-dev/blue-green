name: CI/CD Blue-Green

on:
  push:
    branches:
      - main 

jobs:
  ci:
    name: Integración continua
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar prueba básica
        run: |
          python -c "from app import crear_servidor; print('Código válido')"

  cd:
    name: Despliegue Blue-Green
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Iniciar version Blue
        run: |
          python app.py --version blue --puerto 8000 > blue.log 2>&1 &
          echo $! > blue.pid
          sleep 2

      - name: Iniciar version Green
        run: |
          python app.py --version green --puerto 8001 > green.log 2>&1 &
          echo $! > green.pid
          sleep 2

      - name: Probar version Green
        run: |
          respuesta=$(curl --fail --silent http://127.0.0.1:8001/health)
          echo "Respuesta de Green:"
          echo "$respuesta"
          echo "$respuesta" | grep -i "version: green"

      - name: Cambiar trafico version Green
        run: |
          kill "$(cat blue.pid)"
          sleep 1
          python app.py --version green --puerto 8000 > green.log 2>&1 &
          echo $! > green.pid